# Conda environment for building GPlates/pyGPlates on Windows (Qt6).
#
# Create and activate with:
#     conda env create -n gplates -f env.Windows.yml
#     conda activate gplates
#
# See BUILD-Windows.md for the full build instructions.
#
# Note: This installs Qt6. To build against Qt5 instead, replace 'qt6-main' with
#       'qt-main<6' and 'qwt' with 'qwt<=6.2.0' (the latter avoids pulling in a
#       Qwt build that depends on Qt6). Qt5 also works with Visual Studio 2019, if you'd
#       rather use that: install 'vs2019_win-64' instead of 'vs2022_win-64' below
#       (Qt6 requires Visual Studio 2022). Qt5 support will be removed in a future release.
name: gplates
channels:
  - conda-forge
dependencies:
  # Build tools. 'vs2022_win-64' provides the MSVC toolchain and installs conda
  # activation scripts that set up the compiler environment (so the Ninja generator
  # can find the compiler without a Visual Studio developer command prompt).
  - cmake
  - ninja
  - vs2022_win-64
  # Python (embedded in GPlates; the extension module for pyGPlates).
  # OpenBLAS (rather than MKL) so that numpy works in the standalone GPlates install
  # (its native libraries are bundled automatically; MKL cannot be bundled reliably).
  - python
  - numpy
  - libblas=*=*openblas
  # Libraries.
  - qt6-main
  - qwt
  - libboost-devel
  - libboost-python-devel
  - libgdal
  - proj
  - cgal-cpp
  - gmp
  - mpfr
  - glew
  - zlib
  # GoogleTest (optional): only needed to build the 'gplates-unit-test' executable.
  - gtest
