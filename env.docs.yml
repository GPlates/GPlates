# Extra conda dependencies for building the pyGPlates Python API documentation
# (the "doc-python-api" build target).
#
# This is an *overlay* on top of the platform build environment - it does not create a usable
# environment on its own. Building the documentation requires building pyGPlates first, because
# Sphinx reads the docstrings by importing the 'pygplates' module, so create the build
# environment first and then update it with this file:
#
#     conda env create -n gplates -f env.Windows.yml   # or env.macOS.yml / env.Linux.yml
#     conda env update -n gplates -f env.docs.yml
#     conda activate gplates
#
# Keeping these separate means a CI job that only builds GPlates/pyGPlates (or wheels) does not
# pay for the documentation toolchain.
#
# Note: Sphinx must be installed into the *same* Python that pyGPlates is built against, since it
#       imports the 'pygplates' extension module in-process. The "doc-python-api" target runs
#       Sphinx as 'python -m sphinx' using exactly that interpreter, and CMake reports
#       "Looking for sphinx... - NOT found in <python>" when it is missing there.
#
# There are no platform-specific entries below (both packages are pure Python), so this one file
# serves Windows, macOS and Linux.
name: gplates
channels:
  - conda-forge
dependencies:
  - sphinx
  # The "Read the Docs" theme selected by 'html_theme' in doc-python-api/conf.py.in.
  - sphinx_rtd_theme
