{% set name = "pygplates" %}

# LOCAL form (this repository): the version is read from cmake/modules/Version.cmake - the same
# PYGPLATES_PEP440_VERSION that scikit-build-core reads (see pyproject.toml) - and the source is a
# clone of this checkout (committed files only, like the sdist). The conda-forge FEEDSTOCK form
# replaces this block and the 'source:' block below - both halves have to be swapped together, and
# README.md has the steps.
{% set version = load_file_regex(
    load_file="../../cmake/modules/Version.cmake",
    regex_pattern="set\\(\\s*PYGPLATES_PEP440_VERSION\\s+(?P<value>\\S+)\\s*\\)",
    from_recipe_dir=True).group("value") %}
#
# FEEDSTOCK form, half one: delete the four lines above and uncomment the line below, dropping its
# leading '# '. It has to stay ABOVE 'package:'. Jinja runs '{% set %}' statements in document
# order, so a version set after its use renders as blank and the recipe goes to conda-forge with no
# version at all - while the 'url:' below still interpolates correctly, which hides the mistake.
#
# {% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_url: ../../

# FEEDSTOCK form, half two: replace the 'source:' block above with these three lines, minus their
# leading '# '. From then on the autotick bot maintains the version, the sha256 and the build
# number. Inert as it stands: conda-build blanks every comment line before it renders the Jinja.
#
# source:
#   url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
#   sha256: <sha256 of the PyPI sdist>

build:
  number: 0

requirements:
  build:
    # Cross builds (conda-forge cross-compiles linux-aarch64, linux-ppc64le and osx-arm64).
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - cmake
    - make  # [unix]
    - {{ compiler('c') }}
    # Locally this needs the c_stdlib values in conda_build_config.yaml (conda-build has no default
    # and would ask for a nonexistent 'c_win-64'); conda-forge supplies them itself.
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    # Keep in sync with the [build-system] requires bounds in the root 'pyproject.toml', which
    # explains them - conda-build runs pip without build isolation, so this pin (not that one)
    # selects the backend version here.
    - scikit-build-core >=0.11.1,<2
    # Must be NumPy 2.x at build time (pyproject's 'numpy>=2.0' build requirement is not enforced
    # here): a module built against 1.x refuses to import under NumPy 2. conda-forge pins numpy 2;
    # conda_build_config.yaml does the same locally. Without NumPy, configure only warns and the
    # module silently loses NumPy scalar support (src/CMakeLists.txt).
    - numpy
    # CGAL is header-only (no run_exports), so host-only. GMP/MPFR reach the link line only through
    # the CGAL::CGAL target; their run_exports cover run time.
    - cgal-cpp
    - gmp
    - mpfr
    # The module links Qt Core ONLY (src/CMakeLists.txt) - no Gui/Widgets/OpenGL - so no GLEW, Qwt,
    # libGL/EGL/GLX/GLU or X11 anywhere in this recipe. The test block fails if any creep back.
    - qt6-main
    - libboost-devel
    - libboost-python-devel
    # The metapackage, not libgdal-core: its run_exports carry the plugin drivers (netCDF etc).
    - libgdal
    - proj
    - zlib
  run:
    # Explicit as well as via the host run_exports (belt-and-braces: the feedstock builds with
    # error_overlinking). Each of these is absorbed by the pinned run_export of the same package,
    # so naming it costs nothing. 'zlib' is deliberately NOT among them: the library the module
    # links is libz/zlib1, which ships in 'libzlib', and host 'zlib' exports a pin on that. Naming
    # 'zlib' here adds a second, unpinned dependency on the development package instead.
    - python
    - numpy
    - qt6-main
    - libgdal
    - proj

test:
  source_files:
    - pygplates/test
    - cmake/check_linkage.py
  requires:
    # check_linkage.py lists dependencies with readelf on Linux (unprefixed, from 'binutils').
    - binutils  # [linux]
  imports:
    - pygplates
  commands:
    # Mirrors the wheel test-command in pyproject.toml. '-X faulthandler' prints the Python stack if
    # the native module crashes. test.py writes into its own fixtures/ (source_files are copied to a
    # writable directory) and fails unless at least 400 tests ran.
    - python -X faulthandler pygplates/test/test.py
    # Fails if the installed module links Qwt/GLEW/OpenGL/Qt Gui|Widgets|Svg. Skipped on Windows:
    # dumpbin is not on PATH in a conda test environment and the script fails loudly without its
    # lister (the wheel CI covers Windows linkage).
    - python cmake/check_linkage.py --installed  # [not win]

about:
  home: https://www.gplates.org/
  summary: 'Python library for fine-grained access to GPlates functionality'
  license: GPL-2.0-only
  license_family: GPL
  license_file: COPYING
  doc_url: https://www.gplates.org/docs/pygplates/index.html
  dev_url: https://github.com/GPlates/GPlates

extra:
  recipe-maintainers:
    - jcannon-gplates
