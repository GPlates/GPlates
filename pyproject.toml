#
# Build system.
#
[build-system]
build-backend = "scikit_build_core.build"
requires = [
    # Using scikit-build-core backend build system.
    #
    # The floor: the PEP 639 license metadata used in [project] below ('license' as an SPDX
    # expression, plus 'license-files') needs scikit-build-core 0.11 - older versions reject
    # it. And 0.11.0 itself must be avoided: it inlined the license file into the 'License:'
    # metadata header in a way that broke RFC 822 header folding on the form feeds in COPYING,
    # ending the header block early - so pip never saw 'Requires-Dist: numpy' (and older
    # Pythons raised outright). The SPDX expression means nothing is inlined any more, but the
    # floor stays at the fixed release.
    # See https://github.com/scikit-build/scikit-build-core/issues/1006.
    #
    # The cap: scikit-build-core 1.0 deprecated the '[tool.scikit-build.metadata]' table that
    # provides our version (below), in favour of '[[tool.dynamic-metadata]]' - a migration that
    # would raise the floor to 1.0, which not every build environment has yet. The deprecated
    # table keeps working throughout 1.x because 'minimum-version' (see [tool.scikit-build])
    # freezes behaviour at the floor version; the cap stops the major that could complete the
    # removal from being picked up as it releases - which would break building every
    # already-published sdist. Bump it deliberately, checking the table (or its replacement)
    # still resolves the version.
    #
    # Keep these bounds in sync with the host dependency in 'pygplates/conda/meta.yaml':
    # conda builds run pip without build isolation, so that pin - not this one - selects the
    # backend version there (and only a *floor* drift fails loudly, via 'minimum-version'; an
    # exclusion applied here alone would go unenforced in conda builds).
    'scikit-build-core>=0.11.1,<2',

    # PyGPlates accesses the NumPy C API.
    #
    # Note: We must *build* against NumPy 2.x in order to support both NumPy 1.x and 2.x at *runtime*.
    #       However the NumPy *runtime* requirement (in 'dependencies' below) needs no version restriction.
    'numpy>=2.0'
]

#
# Project.
#
[project]
name = "pygplates"
description = "Python library for fine-grained access to GPlates functionality."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]
# A PEP 639 SPDX license expression (metadata 2.4) - the 'License:' header becomes a short
# 'License-Expression:' instead of an inlined license text (see [build-system] above for how
# that once went wrong). The full text still ships in the wheel, via 'license-files', at
# '.dist-info/licenses/COPYING' ('pygplates/wheel/check_wheel_contents.py' verifies it got
# there). Note that *reading* metadata 2.4 needs twine >= 6.1 / pkginfo >= 1.12; older ones
# fail with a misleading "Metadata is missing required fields: Name, Version".
license = "GPL-2.0-only"
license-files = ["COPYING"]
authors = [
  { name = "John Cannon", email = "john.cannon@sydney.edu.au" },
]
maintainers = [
  { name = "John Cannon", email = "john.cannon@sydney.edu.au" },
]
keywords = ["pygplates", "gplates", "plate", "tectonics"]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
]

#
# Project URLs.
#
[project.urls]
Homepage = "https://www.gplates.org"
Documentation = "https://www.gplates.org/docs/pygplates/index.html"
Source = "https://github.com/GPlates/GPlates"
Discussions = "https://discourse.gplates.org/"

#
# Scikit-build-core.
#
[tool.scikit-build]

# Freeze scikit-build-core's default behaviours at our floor version (resolved from the
# [build-system] requires entry above) instead of letting them track whatever backend version
# happens to be installed. This is also what keeps the deprecated '[tool.scikit-build.metadata]'
# table working under scikit-build-core 1.x (see [build-system]). Not redundant with the
# requires floor, which only constrains what may be *installed*.
minimum-version = "build-system.requires"

# Required to use a version provider that scikit-build-core does not ship itself - here
# 'gplates_version' in the 'cmake' directory (see [tool.scikit-build.metadata.version] below).
# Without it the build fails outright with "experimental must be enabled currently to use
# plugins not provided by scikit-build-core".
#
# It gates only the plugin mechanism, not the plugin: everything the provider does is in this
# repository, so the exposure is that scikit-build-core may change the plugin protocol (the two
# functions at the bottom of 'cmake/gplates_version.py') in a future version. The cap in
# [build-system] is what stops such a change arriving on its own; 'minimum-version' above pins
# the behaviour of everything else.
experimental = true

# Ship the resolved versions in the sdist. 'cmake/gplates_version.py' writes this file while
# resolving the version for the metadata below; it is generated and gitignored, so it has to
# be named here or it would be left out of the sdist.
#
# It is what lets an unpacked sdist configure at all. A pyGPlates build needs the *GPlates*
# version too ('src/global/Version.cc' is compiled into the module, and its version string
# reaches user data - exported shapefiles carry it), and PKG-INFO records only the pyGPlates
# one. Without this the sdist on PyPI, and the conda-forge feedstock that builds from it,
# fail at configure time with no way to supply the missing version.
sdist.include = ["cmake/modules/VersionRecorded.cmake"]

# Where CMake builds. Left at scikit-build-core's default, a fresh temporary directory each time,
# so that a 'pip install .' from this source tree - the install route BUILD-Linux.md,
# BUILD-macOS.md and BUILD-Windows.md all document - can never reuse a build tree left behind by
# another Python version.
#
# Uncomment for rebuild speedups while developing, keeping the '{wheel_tag}' so that different
# Python versions still get a tree each.
#build-dir = "dist/build/{wheel_tag}"
#
# The wheel builds do share one directory across Python versions, deliberately and together with
# the wipe that makes it safe - see [tool.cibuildwheel.config-settings] below.

# Build target is 'pygplates'.
build.targets = ["pygplates"]

# Optionally enable CMake verbose output (eg, during development).
# For example, to show compiler command-line flags/options.
#build.verbose = true

# Make release builds.
cmake.build-type = "Release"

# Our minimum requirement for CMake.
# Look up 'cmake_minimum_required' in 'CMakeLists.txt' in root source dir.
cmake.version = "CMakeLists.txt"

# Scikit-build-core's internal logging level ("DEBUG", "INFO", "WARNING" or "ERROR").
logging.level = "WARNING"

# Run CMake before building a wheel.
wheel.cmake = true

# Disable Python file inclusion entirely, and rely only on CMake’s install mechanism.
# Our 'install' target will install pyGPlates as a package (complete with __init__.py).
wheel.packages = []

#
# CMake arguments/defines.
#
[tool.scikit-build.cmake.define]


# Build pyGPlates (not GPlates).
GPLATES_BUILD_GPLATES = "FALSE"


# Optionally determine whether to install binary shared library dependencies of pyGPlates
# (using the GPLATES_INSTALL_STANDALONE and GPLATES_INSTALL_STANDALONE_SHARED_LIBRARY_DEPENDENCIES variables).
#
# By default, dependency shared libraries ARE installed when running 'pip wheel ...' or 'pip install ...' directly, but
# NOT installed when running 'conda install ...' (note that conda uses 'pip install ...' and so also uses scikit-build-core).
# This is because conda manages binary shared library dependencies itself, whereas a regular pip install does not.
#
# This means if you type 'pip install .' (ie, install directly from the source code) then the binary shared library dependencies
# of pyGPlates also get installed into Python (site-packages). This is necessary, for example, for the Windows platform (for Python >= 3.8)
# which no longer searches for DLLs using the PATH environment variable.
#
# Note that it is better to first build a wheel and then repair it with auditwheel(manylinux)/delocate(macOS)/delvewheel(Windows)
# in order to check dependencies (manylinux), copy them into the wheel and (most importantly) give them unique names (to avoid conflicts).
# And then install that repaired wheel (using 'pip wheel ...'). This avoids potential issues with binary dependency conflicts from other
# installed Python packages that have the same dependencies (eg, the GDAL dependency). This means first creating a wheel *without* copying
# dependency libraries into it. For example, building a wheel that will subsequently be repaired by auditwheel/delocate/delvewheel can be done with:
#    "python -m pip wheel --wheel-dir dist -v --config-settings cmake.define.GPLATES_INSTALL_STANDALONE_SHARED_LIBRARY_DEPENDENCIES=FALSE <source_dir>"


# Build in parallel on Windows (in Visual Studio).
#
# This is enabled by default (and only used on Windows platforms).
#GPLATES_MSVC_PARALLEL_BUILD = "TRUE"
# Specify the number of parallel build processes (default is zero if unspecified, which means use all available CPUs).
#GPLATES_MSVC_PARALLEL_BUILD_PROCESSES = "0"
#
# macOS and Linux: To build in parallel optionally set the CMAKE_BUILD_PARALLEL_LEVEL *environment* variable.
#                  The 'Unix Makefiles' generator defaults to using a single CPU (if not specified).
#                  The 'Ninja' generator defaults to using all CPUs (if not specified).


# Optionally set the macOS deployment target to a macOS version earlier than your build machine
# (so users on older systems can still use the wheel).
#
# To do this you'll need to set the MACOSX_DEPLOYMENT_TARGET *environment* variable.
# Note: The CMAKE_OSX_DEPLOYMENT_TARGET define is not actually used (by scikit-build-core) to determine the wheel tag.
#       But CMake will use MACOSX_DEPLOYMENT_TARGET to set the default value for CMAKE_OSX_DEPLOYMENT_TARGET.
#
# Note: If you do this then you'll also need the same deployment target set in your dependency libraries
#       (eg, Qt, Boost, PROJ, GDAL, CGAL). Building against binaries compiled for a newer macOS version
#       than MACOSX_DEPLOYMENT_TARGET can result in linker warnings or runtime failures.
#       For Apple Silicon, targeting 11.0 is sufficient (since M1/arm64 wasn't introduced until macOS 11.0).


#
# The version, resolved by the same CMake code the build itself uses.
#
# 'cmake/gplates_version.py' runs 'cmake -P cmake/modules/VersionFromGit.cmake pygplates',
# which combines the hand-edited release target in
# 'cmake/modules/VersionRelease.cmake' with a development number counted from this
# repository's git tags. Nothing here parses a version out of a file any more: going
# through the same CMake code as the build keeps the wheel metadata and the module it
# contains from ever disagreeing about the version.
#
# 'provider-path' puts the 'cmake' directory on sys.path so 'provider' can be imported from
# it. Building where git cannot answer - inside the Linux wheel containers, from an unpacked
# sdist, or under conda-build - is covered by the fallbacks documented in
# 'VersionFromGit.cmake'; 'environment-pass' below is what carries the answer into the
# containers.
#
[tool.scikit-build.metadata.version]
provider = "gplates_version"
provider-path = "cmake"

#
# Cibuildwheel.
#
# All wheels (local and CI) are built with cibuildwheel - see 'pygplates/wheel/README.md' for
# how to build one locally and '.github/workflows/build-wheels.yml' for the CI builds.
#
[tool.cibuildwheel]

# The Python versions to build wheels for.
#
# An explicit list (rather than cibuildwheel's default of everything) so that a new Python
# version is added deliberately: NumPy must ship wheels for it first (we build against the
# NumPy C API), and the Linux images must be rebuilt with its Boost.Python library
# (keep PYTHON_VERSIONS in 'pygplates/wheel/versions.sh' in sync with this list).
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]

# Belt-and-braces versus the explicit 'build' list above:
# - musllinux (Alpine etc) would need a separate dependency stack built against musl
#   (Alpine users can build from the sdist instead).
# - PyPy is untested with Boost.Python.
skip = ["*musllinux*", "pp*"]

# Print the pip/build output (the default of 0 hides the entire CMake build behind a spinner,
# which makes CI failures undiagnosable).
build-verbosity = 1

# Run the pyGPlates test suite against each repaired wheel.
#
# 'test-sources' copies 'pygplates/test' into the test working directory (preserving the
# relative path), so the test command below finds it without referencing {project}
# (which is unavailable when testing on a different machine/container than the build).
# -X faulthandler prints the Python stack if the native library crashes (a crash otherwise
# reports nothing but the exit code, which makes CI failures undiagnosable).
#
# 'check_wheel_contents.py' runs after the suite because it checks the wheel rather than the code:
# the test suite passes against a wheel whose PROJ and GDAL data never made it in (which is how
# the Windows wheels came to ship without them), so the packaging needs a check of its own. It
# also lists the libraries the repair step vendored, which is the record of what the wheel ships.
#
# 'check_linkage.py' is the CTest of the same name, run here as well because the two check
# different artifacts: the CTest sees the module in the build tree, this sees the module inside
# the repaired wheel, whose dependency names the repair step has rewritten. The August 2026
# segfault at 'import pygplates' was in a wheel whose build-tree module was fine.
test-sources = [
    "pygplates/test",
    "pygplates/wheel/check_wheel_contents.py",
    "cmake/check_linkage.py",
]
test-command = [
    "python -X faulthandler pygplates/test/test.py",
    "python pygplates/wheel/check_wheel_contents.py",
    "python cmake/check_linkage.py --installed",
]

[tool.cibuildwheel.config-settings]
# The wheel-repair step (auditwheel/delocate/delvewheel) vendors the dependency shared
# libraries into the wheel and mangles their names - so CMake must not copy them in as well.
# This must be explicit: the automatic disabling of it keys on CONDA_BUILD, not on conda
# presence (see 'cmake/modules/ConfigDefault.cmake').
#
# NOTE: Platform 'config-settings' tables below do NOT merge with this table - they override
#       it entirely, so each platform table repeats this define.
"cmake.define.GPLATES_INSTALL_STANDALONE_SHARED_LIBRARY_DEPENDENCIES" = "FALSE"

# Build every Python version in the one directory, overriding the temporary directory that
# [tool.scikit-build] leaves everything else with.
#
# The compiler cache depends on it. sccache keys on the *preprocessor output*, which carries a
# '# line "<path>"' marker for every header the translation unit includes - so when the generated
# headers (config.h, and Qt's moc and ui output) sit in a different directory each time, every
# source that includes one hashes differently and cannot be reused. Measured before this was
# pinned: the second Python version reused 435 of 971 objects, on Linux and macOS alike.
#
# 'before-build' empties it, so this is not an incremental build across Python versions: the
# objects are reused through the cache, which validates them by hashing what went into them,
# rather than by leaving a build tree in place that CMake and Ninja must reason about after the
# Python version underneath it changed. That pairing is why this is set here, with the wheel
# builds that do the wiping, rather than as the default for every build of this project.
"build-dir" = "build/wheel"

[tool.cibuildwheel.linux]

# Carry the resolved version into the container.
#
# The Linux wheels are the one build that cannot work the version out for itself:
# cibuildwheel *copies* the project into the container, the images do not install git, and
# the CI checkout is shallow in any case. So it is resolved once outside (the workflow's
# sdist job) and passed in, where both the metadata provider and CMake read it - a
# 'cmake.define' would reach only CMake, letting the wheel filename and the module's
# __version__ drift apart.
#
# Building Linux wheels locally therefore needs it exported first:
#     export PYGPLATES_PEP440_VERSION=$(cmake -P cmake/modules/VersionFromGit.cmake pygplates)
#     export GPLATES_SEMANTIC_VERSION=$(cmake -P cmake/modules/VersionFromGit.cmake gplates)
# (see pygplates/wheel/README.md).
#
# Both, not just the pyGPlates one: a pyGPlates build resolves the GPlates version as well
# ('src/global/Version.cc' is compiled into the module), so passing only one still leaves the
# configure with a version it cannot derive.
environment-pass = ["PYGPLATES_PEP440_VERSION", "GPLATES_SEMANTIC_VERSION"]
# Custom manylinux_2_28 images with the pyGPlates dependencies pre-installed - built and
# pushed to GHCR by '.github/workflows/build-wheel-images.yml' from
# 'pygplates/wheel/manylinux_2_28.dockerfile' (which can also build them locally).
manylinux-x86_64-image = "ghcr.io/gplates/pygplates-manylinux_2_28_x86_64:latest"
manylinux-aarch64-image = "ghcr.io/gplates/pygplates-manylinux_2_28_aarch64:latest"

# Empty the build directory before each wheel build. The 'build-dir' in the config-settings below
# points every Python version at one path, so the compiler cache can reuse objects across them;
# wiping it keeps that from also being an incremental build, in which a stale object compiled
# against another version's Python headers would be linked into a released wheel if CMake or Ninja
# ever failed to notice.
before-build = "rm -rf {project}/build/wheel"

# Report the compiler cache after each wheel is built - cibuildwheel says nothing about it
# otherwise, so the sccache defines below have never been shown to do anything.
#
# 'before-test' runs once per Python version, after that version's wheel is built and repaired.
# The figures are cumulative over the cibuildwheel run, so what each version added is the
# difference between successive reports - which is the measurement that matters here, since the
# cache exists to make the *second and later* versions cheap. (Run inside the container, where
# the compiling happens; the image installs sccache on the default PATH.)
before-test = "sccache --show-stats"

[tool.cibuildwheel.linux.config-settings]
# See the notes in [tool.cibuildwheel.config-settings] - this table replaces it, not extends it.
"cmake.define.GPLATES_INSTALL_STANDALONE_SHARED_LIBRARY_DEPENDENCIES" = "FALSE"
"build-dir" = "build/wheel"
# No 'OpenGL_GL_PREFERENCE' here any more: the module links only Qt6Core, so nothing on its
# link line reaches OpenGL and there is no GL family to choose. It was needed while the module
# linked Qt6Gui (whose imported target propagates Qt's OpenGL dependency) - the history, and
# the two-libGLdispatch segfault the define prevented, is in 'pygplates/wheel/README.md'.
# Nothing in the Linux image builds against OpenGL any more either; 'cmake/check_linkage.py'
# and 'pygplates/wheel/check_wheel_contents.py' fail the build if any GL library reappears.
# Compile through sccache (installed in the images above). The cache only lives for the
# duration of the cibuildwheel run, but the per-Python-version builds share most of their
# object files, so the second and later Python versions build many times faster.
"cmake.define.CMAKE_C_COMPILER_LAUNCHER" = "sccache"
"cmake.define.CMAKE_CXX_COMPILER_LAUNCHER" = "sccache"

[tool.cibuildwheel.macos]
# The dependency libraries are built once per machine into $HOME/pygplates-wheel-deps
# ('before-all' runs once, before any wheel builds; in CI the directory is restored from a
# cache - see '.github/workflows/build-wheels.yml'). Boost.Python is the one per-Python-version
# dependency, so it's built by 'before-build' instead (which runs with each wheel build's
# Python on PATH), into the same prefix.
before-all = "bash {project}/pygplates/wheel/build_macos_deps.sh"
# The wipe is for the same reason as on Linux (see the note there); the commands run in order.
before-build = [
    "rm -rf {project}/build/wheel",
    "bash {project}/pygplates/wheel/build_boost_python.sh",
]

# Report the compiler cache after each wheel is built, as on Linux (see the note there). sccache
# is on PATH from the dependency prefix, which the environment below puts there.
before-test = "sccache --show-stats"

[tool.cibuildwheel.macos.environment]
# The oldest macOS the wheels support (it also determines the wheel tag, eg, macosx_11_0_arm64).
# It governs the dependency builds too: the hooks above and the pyGPlates build all run with
# this environment (clang reads MACOSX_DEPLOYMENT_TARGET directly, and CMake uses it to
# initialise CMAKE_OSX_DEPLOYMENT_TARGET).
MACOSX_DEPLOYMENT_TARGET = "11.0"
# Where 'build_macos_deps.sh' installs the dependency libraries ($HOME rather than a
# reference to another variable, since cibuildwheel only expands pre-existing environment
# variables here). 'qt/current' is a symlink to the installed Qt version, so the Qt version
# lives only in 'build_macos_deps.sh'.
PYGPLATES_DEPS = "$HOME/pygplates-wheel-deps"
# So CMake finds the dependency libraries (colon-separated; Qt is a separate prefix).
CMAKE_PREFIX_PATH = "$HOME/pygplates-wheel-deps:$HOME/pygplates-wheel-deps/qt/current"
# scikit-build-core appends these to its CMake configure command.
#
# CMAKE_INSTALL_RPATH (a semicolon-separated CMake list) makes the installed pygplates module
# record where the dependency libraries live: CMake strips the build rpaths when it installs,
# and without rpaths delocate cannot resolve the '@rpath/...' install names that the Qt
# frameworks and the CMake-built dependencies use (it follows the module's rpaths to find
# them). This has to be an environment variable rather than a 'cmake.define' below because
# it references $HOME.
CMAKE_ARGS = "-DCMAKE_INSTALL_RPATH=$HOME/pygplates-wheel-deps/lib;$HOME/pygplates-wheel-deps/qt/current/lib"
# For the sccache launchers below ('build_macos_deps.sh' installs sccache into the deps prefix).
PATH = "$HOME/pygplates-wheel-deps/bin:$PATH"

[tool.cibuildwheel.macos.config-settings]
# See the notes in [tool.cibuildwheel.config-settings] - this table replaces it, not extends it.
"cmake.define.GPLATES_INSTALL_STANDALONE_SHARED_LIBRARY_DEPENDENCIES" = "FALSE"
"build-dir" = "build/wheel"
# Prefer dylibs/headers over Apple frameworks when CMake searches - otherwise dependencies
# like Python and zlib can resolve to a framework rather than the intended library. (The root
# CMakeLists.txt only sets this for conda builds - a -D define beats its cache default.)
"cmake.define.CMAKE_FIND_FRAMEWORK" = "LAST"
# Compile through sccache, as on Linux: the cache only lives for the duration of the
# cibuildwheel run, but the second and later Python versions build many times faster.
"cmake.define.CMAKE_C_COMPILER_LAUNCHER" = "sccache"
"cmake.define.CMAKE_CXX_COMPILER_LAUNCHER" = "sccache"

[tool.cibuildwheel.windows]
# Only 64-bit Intel wheels: 32-bit Python is long past relevant for a package like this, and
# Windows-on-ARM users are served (through emulation) by the x64 wheels until there is demand.
archs = ["AMD64"]

# The dependency libraries are built once per machine into C:/pygplates-wheel-deps ('before-all'
# runs once, before any wheel builds; in CI the workflow caches that directory, so later runs
# restore it in minutes and 'before-all' finds everything already stamped - see
# '.github/workflows/build-wheels.yml'). Boost.Python is the one per-Python-version dependency,
# so it's built by 'before-build' instead (which runs with each wheel build's Python on PATH),
# into the same prefix.
#
# They are bash scripts (as on macOS) run through 'bash': cibuildwheel runs these hooks in a cmd
# shell, and Git for Windows - which provides bash - is installed on any machine that cloned this
# repository, and on the GitHub Windows runners.
before-all = "bash {project}/pygplates/wheel/build_windows_deps.sh"
# The wipe is for the same reason as on Linux (see the note there). Run through bash because these
# hooks run in a cmd shell, which has no 'rm'.
before-build = [
    "bash -c \"rm -rf {project}/build/wheel\"",
    "bash {project}/pygplates/wheel/build_boost_python.sh",
]

# Report the compiler cache after each wheel is built, as on Linux (see the note there). sccache
# is on PATH from the dependency prefix, which the environment below puts there.
before-test = "sccache --show-stats"

# Windows has no rpath: a DLL records only its name, and is looked for in a list of directories.
# So delvewheel is told where the dependency DLLs are - the deps prefix (Boost, which b2 installs
# beside its import libraries), Qt's own 'bin', and the vcpkg libraries' 'bin' - since it cannot
# follow the module's own dependency chain to them the way delocate does on macOS. The list is
# quoted because ';' separates commands in the cmd shell that runs this.
repair-wheel-command = "delvewheel repair --add-path \"C:/pygplates-wheel-deps/lib;C:/pygplates-wheel-deps/bin;C:/pygplates-wheel-deps/qt/bin;C:/pygplates-wheel-deps/vcpkg/x64-windows/bin\" -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows.environment]
# Where 'build_windows_deps.sh' installs the dependency libraries. Forward slashes throughout,
# here and below: these values are read by CMake, by delvewheel and by a bash script, and a
# backslash means something else to the last two. A short path at the root of the drive because
# the dependency builds nest deeply enough to meet the 260-character path limit.
PYGPLATES_DEPS = "C:/pygplates-wheel-deps"
# So CMake finds the dependency libraries (Qt and the vcpkg libraries are separate prefixes).
# Semicolon-separated, which is what CMake expects from this environment variable on Windows.
# The value is not quoted here even though it has to reach a shell parser with its semicolons
# intact: cibuildwheel builds the assignment as NAME="value" itself, and quoting it here would
# only nest one pair of quotes inside another - which it rejects as a malformed option.
CMAKE_PREFIX_PATH = "C:/pygplates-wheel-deps;C:/pygplates-wheel-deps/qt;C:/pygplates-wheel-deps/vcpkg/x64-windows"
# Build with Ninja rather than the Visual Studio generator, so that the compiler cache below is
# used at all: the VS generator ignores CMAKE_<LANG>_COMPILER_LAUNCHER, and without a cache every
# Python version pays a full compile of about an hour.
#
# What it costs: Ninja compiles with whatever 'cl' the environment provides, and neither
# cibuildwheel nor scikit-build-core sets the MSVC environment up (scikit-build-core does that
# only for "Visual Studio" generators). So a local wheel build has to be started from an "x64
# Native Tools Command Prompt for VS 2022" - see 'pygplates/wheel/README.md'. In CI the workflow
# imports that environment with 'msvc_env.sh' before running cibuildwheel. The dependency scripts
# are unaffected either way: they set their own environment up, since they run as hooks *inside*
# cibuildwheel and cannot reach back out to it.
CMAKE_GENERATOR = "Ninja"
# So the wheel builds find sccache, which 'build_windows_deps.sh' installs into the deps prefix.
# (Forward slashes are fine in a PATH entry - Windows accepts them as separators.)
PATH = "C:/pygplates-wheel-deps/bin;$PATH"
# Where PROJ and GDAL keep the data files they read at run time (the coordinate reference
# system database, and GDAL's driver data). The build copies both into the wheel, so that an
# installed pyGPlates carries its own - it points the two libraries at them when it is
# imported, which is why these variables do not have to be right on a user's machine, only
# here. On the other platforms the build finds the directories on its own; the vcpkg ones are
# named because vcpkg installs PROJ's tools away from its libraries, so 'projinfo' - which the
# build asks where PROJ's data is - would answer for a directory layout that is not this one.
PROJ_DATA = "C:/pygplates-wheel-deps/vcpkg/x64-windows/share/proj"
GDAL_DATA = "C:/pygplates-wheel-deps/vcpkg/x64-windows/share/gdal"
# So the build can find 'projinfo' itself: CMake searches this for programs, and vcpkg keeps
# a port's tools in a directory of their own rather than in 'bin'.
CMAKE_PROGRAM_PATH = "C:/pygplates-wheel-deps/vcpkg/x64-windows/tools/proj"

[tool.cibuildwheel.windows.config-settings]
# See the notes in [tool.cibuildwheel.config-settings] - this table replaces it, not extends it.
"cmake.define.GPLATES_INSTALL_STANDALONE_SHARED_LIBRARY_DEPENDENCIES" = "FALSE"
"build-dir" = "build/wheel"
# Compile with MSVC. The Visual Studio generator would imply it; Ninja instead has CMake search
# PATH, which on a machine with Visual Studio finds the LLVM it bundles ('VC/Tools/Llvm') and
# builds the wheel with clang - against Qt, Boost and the vcpkg libraries that were all built
# with MSVC. Named rather than pathed, so CMake takes the one the environment set up.
"cmake.define.CMAKE_C_COMPILER" = "cl"
"cmake.define.CMAKE_CXX_COMPILER" = "cl"
# Compile through sccache, as on Linux and macOS - which is what CMAKE_GENERATOR above is for.
"cmake.define.CMAKE_C_COMPILER_LAUNCHER" = "sccache"
"cmake.define.CMAKE_CXX_COMPILER_LAUNCHER" = "sccache"
