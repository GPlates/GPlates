# Conda environment for building GPlates/pyGPlates on macOS (Qt6).
#
# Create and activate with:
#     conda env create -n gplates -f env.macOS.yml
#     conda activate gplates
#
# See BUILD-macOS.md for the full build instructions.
#
# Note: This installs Qt6. To build against Qt5 instead, replace 'qt6-main' with
#       'qt-main<6' and 'qwt' with 'qwt<=6.2.0' (the latter avoids pulling in a
#       Qwt build that depends on Qt6). Qt5 support will be removed in a future release.
#
# Note: The Xcode command-line tools are still required (they provide the macOS SDK
#       and system frameworks). Install them with 'xcode-select --install'.
name: gplates
channels:
  - conda-forge
dependencies:
  # Build tools. 'cxx-compiler' provides the conda Clang toolchain.
  - cmake
  - ninja
  - cxx-compiler
  # Python (embedded in GPlates; the extension module for pyGPlates).
  # OpenBLAS (rather than MKL) so that numpy works in the standalone GPlates bundle
  # (its native libraries are bundled automatically; MKL cannot be bundled reliably).
  - python
  - numpy
  - libblas=*=*openblas
  # Libraries.
  - qt6-main
  - qwt
  - libboost-devel
  - libboost-python-devel
  - libgdal
  - proj
  - cgal-cpp
  - gmp
  - mpfr
  - glew
  - zlib
  # GoogleTest (optional): only needed to build the 'gplates-unit-test' executable.
  - gtest
