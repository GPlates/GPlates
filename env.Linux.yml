# Conda environment for building GPlates/pyGPlates on Linux (Qt6).
#
# Create and activate with:
#     conda env create -n gplates -f env.Linux.yml
#     conda activate gplates
#
# See BUILD-Linux.md for the full build instructions (including a system-package
# alternative to conda on Ubuntu).
#
# Note: This installs Qt6. To build against Qt5 instead, replace 'qt6-main' with
#       'qt-main<6' and 'qwt' with 'qwt<=6.2.0' (the latter avoids pulling in a
#       Qwt build that depends on Qt6). Qt5 support will be removed in a future release.
name: gplates
channels:
  - conda-forge
dependencies:
  # Build tools. 'cxx-compiler' provides the conda GCC toolchain.
  - cmake
  - ninja
  - make
  - cxx-compiler
  # Python (embedded in GPlates; the extension module for pyGPlates).
  # OpenBLAS (rather than MKL) so that numpy works in a standalone GPlates install
  # (its native libraries are bundled automatically; MKL cannot be bundled reliably).
  - python
  - numpy
  - libblas=*=*openblas
  # Libraries.
  - qt6-main
  - qwt
  - libboost-devel
  - libboost-python-devel
  - libgdal
  - proj
  - cgal-cpp
  - gmp
  - mpfr
  - glew
  - zlib
  # GoogleTest (optional): only needed to build the 'gplates-unit-test' executable.
  - gtest
  # OpenGL / X11 development libraries needed to compile the GPlates GUI on Linux.
  - libgl-devel
  - libopengl-devel
  - libglx-devel
  - libegl-devel
  - libglu
  - libdrm
  - xorg-libx11
  - xorg-libxext
  - xorg-libxfixes
  - xorg-libxrender
  - xorg-libxxf86vm
